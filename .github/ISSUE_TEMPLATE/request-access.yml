name: Request access to Covi-pi-1 Design
description: Ask for access to the private Covi-pi-1 Design repository and its npm package.
title: "Access request: "
labels: ["access-request"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your interest in **Covi-pi-1 Design**. This request is a **public issue**, so please don't include private details (phone numbers, addresses, passwords).
        Once approved, GitHub emails you an invitation to the repository. You can already browse every component in the [live Storybook](https://op1.covilabs.com).
  - type: input
    id: username
    attributes:
      label: GitHub username
      description: The account that should get access.
      placeholder: octocat
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: Your name
      description: So the owner knows who you are.
    validations:
      required: true
  - type: textarea
    id: use
    attributes:
      label: What would you like to use it for?
      description: A sentence or two is enough (a personal project, a client site, learning, …).
    validations:
      required: false
  - type: checkboxes
    id: licence
    attributes:
      label: Licence
      options:
        - label: I understand Covi-pi-1 Design is licensed under CC BY 4.0, and I will credit it ("Covi-pi-1 Design" by Luis Carlos Covilla Yarce, CC BY 4.0) when I use or adapt it.
          required: true
